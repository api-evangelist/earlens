aid: earlens
name: EarLens
description: 'Earlens Corporation is a privately held medical technology company in
  Menlo Park, California that makes the Earlens Contact Hearing Solution, a non-surgical,
  custom-fit direct-drive hearing device. Instead of amplifying sound through a speaker,
  a custom lens rests on the eardrum and is driven by light from an ear-tip, vibrating
  the eardrum directly to reproduce a broader frequency range than conventional hearing
  aids. Founded by Dr. Rodney Perkins, the company holds more than 180 patents, received
  FDA clearance for its second-generation system in 2019, and was named to TIME''s
  Best Inventions of 2020. Earlens is sold through audiology and ENT providers and
  publishes a consumer and provider marketing site, patient support documents, and
  a news section. As of this profiling pass it publishes no public developer portal,
  API documentation, SDK, or machine-readable API contract.'
